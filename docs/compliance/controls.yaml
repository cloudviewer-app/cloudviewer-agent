# yaml-language-server: $schema=../../../compliance/schema/controls.v2.schema.json
# cloudviewer-agent — Compliance-Controls, maschinenlesbar. Keine Rechtsberatung.
#
# Erzeugt 2026-10-18 aus den Vorlagen base, oss-commercial, pld (~/Developer/compliance/catalog/templates/)
# plus agent-eigene Zeilen (agent-*, tr2-*, tr3-*). Bewertet gegen origin/main 99642fa; Begründung und
# Reihenfolge in gap-scan-2026-10-18.md.
#
# status: yes = erfüllt laut Nachweis, partial = teilweise, no = offen, n.a. = nicht anwendbar (mit Grund).
# evidence: Pfade relativ zu diesem Repo, URLs, oder "cloudviewer:<pfad>" für das Monorepo ~/Developer/cloudviewer.
# Vieles zur DSGVO (Verzeichnis, AVV, TOMs, Datenpannen) gehört zum Projekt cloudviewer und steht dort.
# Zeilen mit provenance.reviewed: false hat noch kein Mensch geprüft.
version: 2
project: cloudviewer-agent
catalog: compliance
controls:
  - {id: impressum, framework: ddg, maps: [de.ddg.s5], requirement: "§ 5 DDG: Impressum", evidence: [https://cloudviewer.app/imprint], check: {type: manual, ref: Impressum auf jeder Domain/App-Seite}, status: partial, note: "Das Repo und die README haben kein Impressum; cloudviewer.app/imprint ist erreichbar (2026-10-18). Offen: get.cloudviewer.app (noch nicht live) und die README sollen auf das Impressum verweisen; Herstellerangabe in nfpm.yaml/Dockerfile ist 'Cloud Viewer', nicht 'Mitja Martini'.", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: privacy-notice, framework: gdpr, maps: [eu.gdpr.art13, eu.gdpr.art12], requirement: "Art. 13 DSGVO: Datenschutzerklärung", evidence: [https://cloudviewer.app/privacy, cloudviewer:docs/compliance/privacy-policy-draft.md], check: {type: manual, ref: Datenschutzerklärung}, status: partial, note: "Die Verarbeitung der Agent-Daten ist Teil von Cloud Viewer und dort beschrieben (Entwurf). Im Agent-Repo fehlt eine vollständige Liste, was der Agent sendet (siehe agent-data-transparency).", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: legal-basis, framework: gdpr, maps: [eu.gdpr.art6.1, eu.gdpr.art5.1], requirement: "Art. 5, 6 DSGVO: Rechtsgrundlage und Datenminimierung", evidence: [agent/libexec/render-config, cloudviewer:docs/compliance/gdpr-records.md], check: {type: manual, ref: Verarbeitungen durchgehen}, status: partial, note: "Minimierung im Agent: Journald nur Priorität 0-4, Authorization-Header geschwärzt, auth.log nur nach Opt-in des Teams, Disk-Health nur nach Einschalten auf dem Host. Rechtsgrundlage und Rollen stehen im Verzeichnis des Monorepos.", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: ropa, framework: gdpr, maps: [eu.gdpr.art30.1], requirement: "Art. 30 Abs. 1 DSGVO: Verzeichnis von Verarbeitungstätigkeiten", evidence: [cloudviewer:docs/compliance/gdpr-records.md], check: {type: manual, ref: Verzeichnis vorhanden}, status: partial, note: "Das Verzeichnis des Monorepos nennt Logzeilen, Metriken und Server-IPs. Offen: Seriennummern und Modelle der Laufwerke (Disk-Health) und Job-Namen aus cloudviewer-report dort ergänzen.", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: processors, framework: gdpr, maps: [eu.gdpr.art28.4, eu.gdpr.art28], requirement: "Art. 28 DSGVO: Verträge mit eigenen Auftragsverarbeitern", evidence: [], check: {type: manual, ref: AVV-Liste}, status: n.a., note: "Der Agent sendet nur an die Cloud-Viewer-Facade (api.cloudviewer.app). Auftragsverarbeiter von Cloud Viewer: Projekt cloudviewer.", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: transfers, framework: gdpr, maps: [eu.gdpr.art44], requirement: "Art. 44 ff. DSGVO: Übermittlung in Drittländer", evidence: [install.sh, README.md], check: {type: manual, ref: Dienstleister außerhalb EU}, status: partial, note: "Bei Installation und Updates kontaktiert der Kundenserver apt.vector.dev / yum.vector.dev und keys.datadoghq.com (Datadog, USA). Das ist keine Übermittlung durch Cloud Viewer, aber in README und AVV-Paket zu nennen (Monorepo-Gap-Scan §5).", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: data-subject-rights, framework: gdpr, maps: [eu.gdpr.art15, eu.gdpr.art17], requirement: "Art. 15, 17 DSGVO: Auskunft und Löschung", evidence: [], check: {type: manual, ref: Ablauf für Anfragen}, status: n.a., note: "Im Projekt cloudviewer. Agent-seitig: 'apt purge' meldet den Server ab und löscht Token, Konfiguration und Puffer (README, Uninstall).", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: security-basics, framework: gdpr, maps: [eu.gdpr.art32], requirement: "Art. 32 DSGVO: technische und organisatorische Maßnahmen", evidence: [README.md, agent/systemd/cloudviewer-agent.service, agent/systemd/cloudviewer-agent-config.service], check: {type: manual, ref: TOMs}, status: partial, note: "Agent-TOMs: HTTPS zur Facade, Token-Datei 0600, zwei unprivilegierte Nutzer, NoNewPrivileges, ProtectSystem. Die TOM-Anlage zum AVV liegt im Monorepo.", provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: breach-process, framework: gdpr, maps: [eu.gdpr.art33, eu.gdpr.art34], requirement: "Art. 33, 34 DSGVO: Datenpannen melden", evidence: [], check: {type: manual, ref: Ablauf Datenpanne}, status: n.a., note: Im Projekt cloudviewer (Runbook für Vorfälle)., provenance: {by: template:base, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-reporting, framework: cra-art, maps: [eu.cra.art14, eu.cra.art14.1, eu.cra.art14.3, eu.cra.art14.7], requirement: "Art. 14 CRA: Meldepflichten (seit 11.09.2026)", evidence: [SECURITY.md, cloudviewer:docs/compliance/controls.yaml], check: {type: manual, ref: "ENISA-Meldeplattform, Ablauf"}, status: partial, note: "Ablauf 24 h / 72 h / 14 Tage steht im Runbook des Monorepos (CRA-ART-14-01 dort: yes). Offen für den Agent: das Runbook muss den Agent als eigenes Produkt nennen; ENISA-Konto und Vertretung (Monorepo-Lawyer-Frage 8).", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-users-informed, framework: cra-art, maps: [eu.cra.art14.8], requirement: "Art. 14 Abs. 8 CRA: Nutzer informieren", evidence: [], check: {type: manual, ref: Kanal für Sicherheitshinweise}, status: "no", note: "Kein Kanal für Sicherheitshinweise an Agent-Nutzer festgelegt. Möglich: GitHub Security Advisories im Repo, Hinweis im Portal (Server-Liste), Mail an Team-Admins.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-risk-assessment, framework: cra-art, maps: [eu.cra.art13.2, eu.cra.annex-i.p1.1, bsi.tr-03183-1.rh-ra-1, bsi.tr-03183-1.rh-doc-1], requirement: "Art. 13 Abs. 2 CRA: Risikobewertung", evidence: [README.md, docs/github-config.md], check: {type: manual, ref: Risikobewertung}, status: partial, note: "Bausteine vorhanden: Sicherheitsabschnitt der README (Facade sendet nur Parameter, Root nur für das Opt-in-Disk-Health), Bedrohungsmodell der Lieferkette in docs/github-config.md. Es fehlt eine schriftliche Risikobewertung je Anhang-I-Punkt mit Restrisiko.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-no-known-vulns, framework: cra-annex-i-1, maps: [eu.cra.annex-i.p1.2a], requirement: "Anhang I Teil I Nr. 2 lit. a CRA: ohne bekannte ausnutzbare Schwachstellen", evidence: [], check: {type: manual, ref: Schwachstellen-Scan vor Release}, status: "no", note: "Kein Schwachstellen-Scan in CI oder vor dem Release. Dependabot findet hier nichts (keine Manifeste). Zu prüfen: Vector-Version (>= 0.57.0), Alpine-Basis des Images (trivy/grype auf das Image), curl im Image.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-secure-default, framework: cra-annex-i-1, maps: [eu.cra.annex-i.p1.2b, eu.cra.annex-i.p1.2d, eu.cra.annex-i.p1.2e], requirement: "Anhang I Teil I Nr. 2 lit. b, d, e CRA: sichere Voreinstellungen, Zugriffsschutz, Verschlüsselung", evidence: [README.md, agent/libexec/render-config, agent/systemd/cloudviewer-disk-health.service, packaging/nfpm.yaml, charts/cloudviewer-agent/templates/daemonset.yaml], check: {type: manual, ref: Sicherheitsfunktionen}, status: partial, note: "Gut: Paket installiert inaktiv, Disk-Health aus, auth.log nur nach Opt-in, Manifest strikt validiert, Token 0600, Standard-Facade per HTTPS. Lücken: Helm-DaemonSet ohne securityContext (läuft als root mit hostNetwork und Host-/ read-only), --facade-url erzwingt kein https.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-updates, framework: cra-annex-i-1, maps: [eu.cra.annex-i.p1.2c, eu.cra.annex-i.p2.7, eu.cra.annex-i.p2.8], requirement: "Anhang I CRA: Sicherheitsupdates, sicher verteilt", evidence: [SECURITY.md, .github/workflows/release.yml, README.md], check: {type: manual, ref: Update-Mechanismus}, status: partial, note: "Updates kommen über den Paketmanager aus einem GPG-signierten Repo – entworfen, nicht in Betrieb: Schlüsselzeremonie offen, get.cloudviewer.app löst nicht auf, Environment 'release' existiert nicht. Kein automatisches Update als Standard und keine dokumentierte Abwahl (Monorepo-Lawyer-Frage 7). Sicherheitsfixes kommen als Patch des aktuellen Zugs, kostenlos.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-sbom, framework: cra-annex-i-2, maps: [eu.cra.annex-i.p2.1, bsi.tr-03183-2.s4], requirement: "Anhang I Teil II Nr. 1 CRA: SBOM", evidence: [.github/workflows/release.yml], check: {type: manual, ref: SBOM je Release}, status: partial, note: "release.yml erzeugt CycloneDX für deb und rpm (anchore/sbom-action), lief aber noch nie; die Vorschau v0.1.0-preview.1 hat kein SBOM. Kein SBOM für das Container-Image und den Helm-Chart. Vector steht nicht im SBOM, weil das Paket es nur als Abhängigkeit nennt (siehe tr2-sbom-quality).", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-cvd-policy, framework: cra-annex-i-2, maps: [eu.cra.annex-i.p2.5, eu.cra.annex-i.p2.6], requirement: "Anhang I Teil II Nr. 5, 6 CRA: Richtlinie zur Offenlegung, Kontaktadresse", evidence: [SECURITY.md, https://cloudviewer.app/.well-known/security.txt], check: {type: manual, ref: "security.txt, SECURITY.md"}, status: partial, note: "SECURITY.md vorhanden, GitHub Private Vulnerability Reporting aktiv (API 2026-10-18). Lücken: security@cloudviewer.app hat keinen MX-Eintrag (2026-10-18); SECURITY.md des Agents nennt keine funktionierende Ausweichadresse; der Policy-Link der security.txt und der SECURITY.md zeigt auf das private Repo mitja/cloudviewer (404 für Außenstehende).", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-advisories, framework: cra-annex-i-2, maps: [eu.cra.annex-i.p2.2, eu.cra.annex-i.p2.4], requirement: "Anhang I Teil II Nr. 2, 4 CRA: Schwachstellen beheben und veröffentlichen", evidence: [], check: {type: manual, ref: Sicherheitshinweise}, status: "no", note: "Kein Changelog, keine Advisories, kein CSAF. GitHub Security Advisories wären der einfachste Weg für dieses Repo.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-support-period, framework: cra-art, maps: [eu.cra.art13.8, eu.cra.art13.19], requirement: "Art. 13 Abs. 8, 19 CRA: Supportzeitraum", evidence: [SECURITY.md], check: {type: manual, ref: Supportzeitraum festgelegt}, status: partial, note: "SECURITY.md: nur der aktuelle Quartalszug wird unterstützt. Ein Supportzeitraum mit Enddatum (Art. 13 Abs. 8, i. d. R. mindestens 5 Jahre) ist nicht angegeben; ob 'nur aktuelle Version' nach Art. 13 Abs. 10 genügt, ist offen.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-user-info, framework: cra-art, maps: [eu.cra.annex-ii, eu.cra.art13.16, eu.cra.art13.17], requirement: "Anhang II CRA: Informationen für Nutzer", evidence: [README.md, SECURITY.md, charts/cloudviewer-agent/README.md], check: {type: manual, ref: Nutzerinformationen}, status: partial, note: "Zweck, Installation, Sicherheitsverhalten, Deinstallation und Kontakt sind beschrieben. Es fehlen: Hersteller mit Name und Anschrift (Mitja Martini, Berlin), Supportende, Ort des SBOM, Liste der gesendeten Daten.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-tech-doc, framework: cra-art, maps: [eu.cra.art31, eu.cra.annex-vii, eu.cra.art28, eu.cra.art32], requirement: "Art. 28, 31, 32 CRA: technische Dokumentation, Konformität (ab 11.12.2027)", evidence: [], check: {type: manual, ref: Technische Dokumentation}, status: "no", note: "Keine technische Dokumentation nach Anhang VII, keine EU-Konformitätserklärung. Ob der Agent eine eigene Erklärung braucht oder Teil von Cloud Viewer ist: Lawyer-Frage.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-classification, framework: cra-art, maps: [eu.cra.art7, eu.cra.annex-iii], requirement: "Art. 7 CRA: Einordnung wichtige Produkte", evidence: [cloudviewer:docs/compliance/gap-scan-2026-10-16.md], check: {type: manual, ref: Einordnung}, status: partial, note: "Monorepo §2.2: Standardkategorie, weil Cloud Viewer nur beobachtet. Für den Agent eigens festzuhalten: kein Fernzugriff, keine Befehle, keine offenen Ports; einziger Root-Teil ist der Opt-in-SMART-Kollektor ohne Netz. Auslöser für Neubewertung: Konsole/Remote-Exec im Agent (Anhang III Nr. 1), Erkennung auf auth.log (SIEM).", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-component-vulns, framework: cra-art, maps: [eu.cra.art13.5, eu.cra.art13.6], requirement: "Art. 13 Abs. 5, 6 CRA: Komponenten Dritter", evidence: [packaging/nfpm.yaml, docker/Dockerfile, .github/renovate.json5], check: {type: manual, ref: Abhängigkeiten}, status: partial, note: "Vector kommt aus Vectors eigenen signierten Repos (Untergrenze >= 0.57.0), Renovate soll Base-Image und Actions pinnen. Es fehlt eine dokumentierte Sorgfaltsprüfung für Vector (Supportstatus, CVE-Beobachtung, Ablauf bei einer Vector-Lücke, Meldung an das Vector-Projekt).", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: cra-foss-route, framework: cra-art, maps: [eu.cra.art32.5], requirement: "Art. 32 Abs. 5 CRA: Erleichterung für quelloffene Software", evidence: [], check: {type: manual, ref: Einordnung FOSS}, status: n.a., note: "Nur für wichtige Produkte relevant; der Agent wird als Standardkategorie eingeordnet (cra-classification). Neu prüfen, falls sich das ändert.", provenance: {by: template:oss-commercial, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: pld-scope, framework: pld, maps: [eu.pld.art4.1, eu.pld.art4.3, eu.pld.art4.10, eu.pld.art2.1, de.prodhaftg-2026.s2, de.prodhaftg-2026.s4], requirement: "Art. 4 PLD, §§ 2–4 ProdHaftG: Einordnung als Produkt", evidence: [docs/compliance/gap-scan-2026-10-18.md], check: {type: manual, ref: Einordnung Produkthaftung}, status: partial, note: "Software ist Produkt (Art. 4 Nr. 1 PLD). Der Agent ist kostenlos und Apache-2.0, wird aber im Rahmen einer Geschäftstätigkeit bereitgestellt (er existiert für den bezahlten Dienst, sammelt Daten für ihn) – Ausnahme nach Art. 2 Abs. 2 / ErwG 14 greift daher voraussichtlich nicht. Lawyer bestätigen lassen.", provenance: {by: template:pld, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: pld-market-dates, framework: pld, maps: [eu.pld.art2.1, eu.pld.art17.1, eu.pld.art8.2, de.prodhaftg-2026.s17, de.prodhaftg-2026.s23], requirement: "Art. 2, 17 PLD, §§ 17, 23 ProdHaftG: Datum des Inverkehrbringens je Version", evidence: [https://github.com/cloudviewer-app/cloudviewer-agent/releases], check: {type: manual, ref: Release-Liste mit Datum}, status: partial, note: "GitHub-Releases tragen Datum und Commit. Bisher nur v0.1.0-preview.1 (2026-10-04, unsigniert), die das Garden-Linux-Feature in gardener-stack per Hash pinnt – klären, ob das schon ein Inverkehrbringen ist. Ab 09.12.2026 gilt das neue Recht für neue Versionen.", provenance: {by: template:pld, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: pld-insurance, framework: pld, maps: [eu.pld.art6.1a, eu.pld.art6.1b, eu.pld.art6.1c, eu.pld.art3, de.prodhaftg-2026.s1], requirement: "Art. 6 PLD, § 1 ProdHaftG: Haftpflichtversicherung für Software", evidence: [], check: {type: manual, ref: "Versicherungsschein, Bedingungen"}, status: "no", note: Versicherung im Workspace 'in-progress'. Der Agent läuft mit Root-Teilen auf Kundenservern; der Versicherer soll das ausdrücklich einschließen., provenance: {by: template:pld, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: pld-terms, framework: pld, maps: [eu.pld.art15, eu.pld.art2.4, de.prodhaftg-2026.s18], requirement: "Art. 15 PLD, § 18 ProdHaftG: kein Haftungsausschluss gegenüber Geschädigten", evidence: [LICENSE], check: {type: manual, ref: AGB/EULA Haftungsklausel}, status: partial, note: "Apache-2.0 §§ 7, 8 schließen Gewährleistung und Haftung aus; gegenüber Geschädigten nach PLD wirkt das nicht. Die Cloud-Viewer-AGB müssen den Agent als Teil des Dienstes nennen und dürfen die Produkthaftung nicht ausschließen.", provenance: {by: template:pld, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: pld-supplier-recourse, framework: pld, maps: [eu.pld.art14, eu.pld.art12.2, eu.pld.art8.1b, de.prodhaftg-2026.s15], requirement: "Art. 12, 14 PLD, § 15 ProdHaftG: Rückgriff in Lieferantenverträgen", evidence: [], check: {type: manual, ref: Verträge mit Lieferanten und Kunden}, status: "no", note: "Vector (Apache-2.0, Datadog) kommt ohne Vertrag; Rückgriff ist praktisch nicht möglich. Risiko über Versicherung und Versionsuntergrenze steuern.", provenance: {by: template:pld, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: pld-security-updates, framework: pld, maps: [eu.pld.art11.2, eu.pld.art4.5, eu.pld.art7.2f, eu.pld.art13, de.prodhaftg-2026.s8, de.prodhaftg-2026.s9], requirement: "Art. 11 Abs. 2 PLD, § 9 Abs. 2 ProdHaftG: Sicherheitsupdates, solange Sie die Kontrolle haben", evidence: [SECURITY.md], check: {type: manual, ref: "Update-Prozess, Supportzeitraum"}, status: partial, note: "Fixes als Patch des aktuellen Zugs, über den Paketmanager. Solange das signierte Repo nicht live ist, gibt es keinen Updateweg für installierte Hosts.", provenance: {by: template:pld, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
  - {id: pld-evidence, framework: pld, maps: [eu.pld.art9, eu.pld.art10.2, eu.pld.art10.4, de.prodhaftg-2026.s19, de.prodhaftg-2026.s20], requirement: "Art. 9, 10 PLD, §§ 19, 20 ProdHaftG: Unterlagen für Offenlegung und Gegenbeweis", evidence: [tests/golden/, tests/run.sh, .github/workflows/ci.yml, .github/workflows/release.yml], check: {type: manual, ref: Ablage technische Dokumentation}, status: partial, note: "Git-Historie, CI-Läufe, Golden-Fixtures für jede gerenderte Konfiguration; Provenance-Attestierung ist in release.yml vorgesehen. Aufbewahrung über 10 Jahre (Art. 17 PLD) ist nicht geregelt: CI-Artefakte verfallen nach 14/90 Tagen.", provenance: {by: template:pld, on: 2026-10-18, model: claude-opus-5-5, reviewed: false}}
