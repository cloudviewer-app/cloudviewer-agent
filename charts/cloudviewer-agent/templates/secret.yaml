{{- /*
Quick-start convenience only: created when token or enrollToken is set
and no existingSecret is named. The documented path is `kubectl create
secret` + existingSecret, which keeps credentials out of values files and
Helm release state (see README.md). Key names are the contract the
DaemonSet's mount and the entrypoint share: "token" (per-server) and
"enroll-token" (fleet).
*/}}
{{- if and (or .Values.token .Values.enrollToken) (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudviewer-agent.fullname" . }}
  labels:
    {{- include "cloudviewer-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.token }}
  token: {{ . | quote }}
  {{- end }}
  {{- with .Values.enrollToken }}
  enroll-token: {{ . | quote }}
  {{- end }}
{{- end }}
