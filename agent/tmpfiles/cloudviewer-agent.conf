# /run/cloudviewer-agent: where the disk-health collector (root) leaves its
# last run for the unprivileged reader. Root-owned and only root-writable,
# so nothing the vector user can write ever reaches the collector; 0755 so
# the reader can list it. Must exist before the collector starts: its unit
# makes it the only writable path (ReadWritePaths=), and systemd refuses
# to start a unit whose ReadWritePaths= is missing.
d /run/cloudviewer-agent 0755 root root -
