{{- /*
Quick-start convenience only: created when .Values.token is set and no
existingSecret is named. The documented path is `kubectl create secret` +
existingSecret, which keeps the token out of values files and Helm
release state (see README.md).
*/}}
{{- if and .Values.token (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudviewer-agent.fullname" . }}
  labels:
    {{- include "cloudviewer-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token | quote }}
{{- end }}
