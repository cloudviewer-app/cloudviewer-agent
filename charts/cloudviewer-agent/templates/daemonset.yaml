{{- /*
Fail fast on misconfiguration — a template error at install time beats a
crash-looping DaemonSet at runtime.
*/}}
{{- if and (not .Values.existingSecret) (not .Values.token) (not .Values.enrollToken) }}
{{- fail "No credential configured. Set existingSecret to a Secret carrying key \"enroll-token\" (fleet enrollment — recommended for clusters) or key \"token\" (per-server, single-node only); or set enrollToken/token to have the chart create that Secret." }}
{{- end }}
{{- if and .Values.token .Values.enrollToken }}
{{- fail "Set either token or enrollToken, not both — a per-server token pins ALL nodes to one server identity and would override fleet enrollment." }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cloudviewer-agent.fullname" . }}
  labels:
    {{- include "cloudviewer-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cloudviewer-agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    # Default RollingUpdate (maxUnavailable 1): a node's agent is briefly
    # down during upgrades; Vector's disk buffers in the pod are ephemeral
    # anyway and the portal tolerates a minute's gap.
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "cloudviewer-agent.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # hostNetwork so the agent reaches the Hetzner metadata service
      # (169.254.169.254) — with fleet enrollment that is how each node
      # learns the instance id it self-registers under — and so network
      # metrics see the node's interfaces (specs/12 §5).
      # ClusterFirstWithHostNet keeps in-cluster DNS working under
      # hostNetwork (the default would silently switch to the node's
      # resolv.conf).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # No serviceAccountName: the agent talks only to the facade, nothing
      # in-cluster — the default SA with zero RBAC is exactly right.
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "cloudviewer-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Credentials via file mount, not env secretKeyRef: a file
            # never shows up in `kubectl describe pod` or crash dumps of
            # the environment, and rotating the Secret updates the mount.
            # Both paths are always declared; the entrypoint treats a
            # missing file as "not provided", so the keys actually present
            # in the Secret decide the mode (per-server wins over fleet).
            - name: CV_AGENT_TOKEN_FILE
              value: /var/run/secrets/cloudviewer/token
            - name: CV_AGENT_ENROLL_TOKEN_FILE
              value: /var/run/secrets/cloudviewer/enroll-token
            - name: CV_AGENT_FACADE_URL
              value: {{ .Values.facadeUrl | quote }}
            # Point Vector's host_metrics at the host's /proc and /sys
            # (mounted read-only below) instead of the container's own.
            - name: PROCFS_ROOT
              value: /host/proc
            - name: SYSFS_ROOT
              value: /host/sys
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: token
              mountPath: /var/run/secrets/cloudviewer
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            # Host root for filesystem/disk metrics (mount usage).
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        # Whole-Secret mount (no items:) on purpose: an items list naming
        # a key the Secret lacks fails the mount, and with existingSecret
        # the chart cannot know whether the user provided "token",
        # "enroll-token", or both.
        - name: token
          secret:
            secretName: {{ include "cloudviewer-agent.secretName" . }}
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
